<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Gerenciador de Tarefas por Voz</title>

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="Gerenciar suas tarefas usando comandos de voz em português">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tarefas">

  <!-- Icons para iOS -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%234f46e5' width='180' height='180' rx='40'/><text x='90' y='105' font-size='80' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='middle'>🎤</text></svg>">

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%234f46e5' width='100' height='100'/><text x='50' y='65' font-size='50' fill='white' text-anchor='middle' dominant-baseline='middle'>🎤</text></svg>">

  <!-- Open Graph para compartilhamento -->
  <meta property="og:title" content="Gerenciador de Tarefas por Voz">
  <meta property="og:description" content="Controle suas tarefas usando comandos de voz em português">
  <meta property="og:type" content="web app">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🎤 Gerenciador de Tarefas</h1>
      <p>Controle suas tarefas por voz</p>
    </header>

    <div class="main-content">
      <div class="voice-section">
        <div class="mic-button-container">
          <button id="micBtn" class="mic-btn">
            <span class="mic-icon">🎤</span>
            <span>Pressione para falar</span>
          </button>
          <p id="transcript" class="transcript"></p>
        </div>

        <div id="status" class="status"></div>
        <div id="response" class="response"></div>
      </div>

      <div class="tasks-section">
        <div class="tabs">
          <button class="tab-btn active" data-filter="pendentes">
            📝 Pendentes
          </button>
          <button class="tab-btn" data-filter="completas">
            ✅ Completas
          </button>
        </div>

        <div id="tasksList" class="tasks-list">
          <p class="empty-state">Nenhuma tarefa ainda. Use a voz para criar uma!</p>
        </div>
      </div>
    </div>

    <footer>
      <button id="logoutBtn" class="logout-btn">Sair</button>
    </footer>
  </div>

  <div id="loginModal" class="modal">
    <div class="modal-content">
      <h2>Login</h2>
      <input type="email" id="emailInput" placeholder="seu@email.com" />
      <button id="loginBtn" class="btn-primary">Entrar</button>
    </div>
  </div>

  <script src="app.js"></script>

  <!-- Registrar Service Worker para PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js').then((registration) => {
        console.log('✅ Service Worker registrado com sucesso');
      }).catch((error) => {
        console.log('⚠️ Erro ao registrar Service Worker:', error);
      });
    }

    // Detectar se está instalado como PWA
    let displayMode = 'browser';
    if (navigator.standalone === true) {
      displayMode = 'standalone';
      console.log('📱 Rodando como PWA instalado');
    }
    if (window.matchMedia('(display-mode: standalone)').matches) {
      displayMode = 'standalone';
      console.log('📱 Rodando como PWA instalado');
    }

    // Suporte para iOS
    if (navigator.maxTouchPoints > 1 || window.ontouchstart !== undefined) {
      console.log('🍎 Detectado dispositivo touch');
    }
  </script>
</body>
</html>
